[package]
name = "earshot"
description = "Play a real guitar into your mic and Earshot listens"
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui"] }
earshot-dsp = { path = "../earshot-dsp" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18.2"
rtrb = "0.4.1"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }

# cpal has no microphone input in the browser, so the web build talks to Web Audio directly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AnalyserNode",
    "AudioContext",
    "AudioContextState",
    "AudioNode",
    "BaseAudioContext",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "Navigator",
    "Window",
] }
